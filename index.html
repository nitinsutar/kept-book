<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kept</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #11110f; color: #f4efe6; font-family: Inter, sans-serif; overflow: hidden; }
  .stage { min-height: 100%; display: grid; place-items: center; perspective: 2500px; padding: 24px 16px 64px; }
  .book {
    width: min(300px, 78vw); height: min(460px, 72vh); position: relative;
    transform-style: preserve-3d; transition: transform .6s ease-in-out;
  }
  .book.open { transform: translateX(38%); transition-duration: .6s; }
  .book.closing { transform: translateX(0); transition-duration: .8s; }
  .shadow {
    position: absolute; left: 6%; right: 6%; bottom: -18px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.55); filter: blur(14px); transition: opacity .4s ease;
  }
  .book.turning .shadow { opacity: .25; }
  .leaf {
    position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.4, 0, .2, 1);
  }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; overflow: auto;
    scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
    background: #f4efe6; color: #1c1917;
    border-radius: 0 3px 3px 0;
    box-shadow: inset 14px 0 18px rgba(80, 50, 20, .06), 0 1px 0 rgba(255,255,255,.4);
  }
  .face.back { transform: rotateY(180deg); background: #efe8dc; border-radius: 3px 0 0 3px; }
  .cover {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background:
      radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,.28), transparent 46%),
      linear-gradient(160deg, #f3eadc 0%, #e7dcc8 48%, #d9cdb8 100%);
    box-shadow: inset 16px 0 22px rgba(90, 60, 20, .08);
  }
  .cover .rule { width: 36px; height: 1px; background: #8a7d6c; margin: 16px auto; }
  .cover h1, .page h2 { font-family: Newsreader, serif; font-weight: 500; letter-spacing: -.03em; margin: 0; }
  .cover h1 { font-size: 42px; }
  .cover p { margin: 0; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: #7a7064; }
  .page { display: flex; flex-direction: column; min-height: 100%; }
  .plate { flex: 1; min-height: 280px; background: #e7dfd2 center/cover no-repeat; position: relative; }
  .plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .caption { padding: 16px 18px 20px; }
  .page h2 { font-size: 26px; line-height: 1.05; }
  .page .when { display: block; margin-top: 6px; color: #8a8176; letter-spacing: .12em; text-transform: uppercase; font-size: 11px; }
  .page p { margin: 8px 0 0; color: #5e574e; line-height: 1.45; font-size: 14px; }
  .hint { position: fixed; bottom: 22px; width: 100%; text-align: center; color: #8a8680; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; }
</style>
</head>
<body>
<div class="stage">
  <div class="book" id="book">
    <div class="shadow"></div>
    <div id="leaves"></div>
  </div>
</div>
<div class="hint" id="hint">Tap to open</div>
<script>
const pages = [
  { cover: true, title: "The house", sub: "Asha · Rohan" },
  { title: "The morning of", sub: "12 January", img: "photos/wedding.jpg", note: "Before anyone arrived. The flowers were already falling." },
  { title: "Her hands", sub: "12 January", img: "photos/hands.jpg", note: "The henna was still dark. She kept them in her lap." },
  { title: "The whole lane", sub: "3 July", img: "photos/rain.jpg", note: "He held the umbrella. She held his arm." },
  { title: "Two glasses", sub: "9 September", img: "photos/dinner.jpg", note: "The city stayed outside. They did not." },
  { title: "The window", sub: "22 August", img: "photos/train.jpg", note: "A small vase, and the rain running the glass." },
  { title: "The first evening", sub: "18 March", img: "photos/door.jpg", note: "The suitcase stayed by the door." },
  { cover: true, title: "Kept", sub: "A book for two" }
];
const book = document.getElementById("book");
const leaves = document.getElementById("leaves");
const hint = document.getElementById("hint");
let index = 0;
let busy = false;
function sheet(p) {
  if (p.cover) return `<div class="face cover"><div><p>${p.sub}</p><div class="rule"></div><h1>${p.title}</h1></div></div>`;
  return `<div class="face page"><div class="plate"><img src="${p.img}" alt="${p.title}"></div><div class="caption"><h2>${p.title}</h2><span class="when">${p.sub}</span><p>${p.note}</p></div></div>`;
}
function draw() {
  leaves.innerHTML = pages.map((p, i) => `
    <div class="leaf" data-i="${i}" style="z-index:${i < index ? i : pages.length - i};transform:rotateY(${i < index ? -180 : 0}deg)">
      ${sheet(p)}
      <div class="face back"></div>
    </div>`).join("");
  hint.textContent = index === 0 ? "Tap to open" : index >= pages.length - 1 ? "Tap to close" : "Tap to turn";
}
function setLeaf(i, angle, duration) {
  const el = leaves.querySelector(`[data-i="${i}"]`);
  if (!el) return;
  el.style.transitionDuration = duration + "s";
  el.style.transform = `rotateY(${angle}deg)`;
  el.style.zIndex = angle < 0 ? i : pages.length - i;
}
book.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  book.classList.add("turning");
  if (index === 0) {
    book.classList.add("open");
    book.classList.remove("closing");
    setLeaf(0, -180, 0.7);
    index = 1;
  } else if (index < pages.length - 1) {
    setLeaf(index, -180, 0.7);
    index += 1;
  } else {
    book.classList.add("closing");
    book.classList.remove("open");
    for (let i = pages.length - 2; i >= 0; i--) {
      setLeaf(i, 0, 0.5);
      await new Promise(r => setTimeout(r, 80));
    }
    index = 0;
    await new Promise(r => setTimeout(r, 800));
  }
  hint.textContent = index === 0 ? "Tap to open" : index >= pages.length - 1 ? "Tap to close" : "Tap to turn";
  setTimeout(() => { book.classList.remove("turning"); busy = false; }, 720);
});
draw();
</script>
</body>
</html>
