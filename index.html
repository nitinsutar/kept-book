<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kept</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #11110f; color: #f4efe6;
    font-family: Inter, sans-serif; overflow: hidden;
  }
  .stage {
    height: 100dvh; width: 100%;
    display: flex; align-items: center; justify-content: center;
    perspective: 2200px;
    padding:
      max(12px, env(safe-area-inset-top))
      16px
      max(46px, calc(36px + env(safe-area-inset-bottom)));
  }
  .book {
    position: relative;
    transform-style: preserve-3d;
    transition: transform .6s ease-in-out;
  }
  .book.open { transform: none; }
  .book.closing { transform: none; }
  .shadow {
    position: absolute; left: 8%; right: 8%; bottom: -14px; height: 22px; border-radius: 50%;
    background: rgba(0,0,0,.5); filter: blur(12px); transition: opacity .4s ease;
  }
  .book.turning .shadow { opacity: .2; }
  .leaf {
    position: absolute; inset: 0; transform-origin: left center; transform-style: preserve-3d;
    transition: transform .7s cubic-bezier(.4, 0, .2, 1);
  }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; overflow: hidden;
    background: #f4efe6; color: #1c1917;
    border-radius: 0 4px 4px 0;
    box-shadow: inset 12px 0 16px rgba(80, 50, 20, .06);
  }
  .face.back { transform: rotateY(180deg); background: #efe8dc; border-radius: 4px 0 0 4px; }
  .cover {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background:
      radial-gradient(120% 80% at 80% 0%, rgba(255,255,255,.28), transparent 46%),
      linear-gradient(160deg, #f3eadc 0%, #e7dcc8 48%, #d9cdb8 100%);
    box-shadow: inset 14px 0 18px rgba(90, 60, 20, .08);
  }
  .cover .rule { width: 32px; height: 1px; background: #8a7d6c; margin: 14px auto; }
  .cover h1, .page h2 { font-family: Newsreader, serif; font-weight: 500; letter-spacing: -.03em; margin: 0; }
  .cover h1 { font-size: clamp(32px, 8vw, 40px); }
  .cover p { margin: 0; letter-spacing: .18em; text-transform: uppercase; font-size: 11px; color: #7a7064; }
  .page { display: flex; flex-direction: column; height: 100%; }
  .plate { flex: 1; min-height: 0; background: #e7dfd2 center/cover no-repeat; }
  .plate img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .caption { flex: 0 0 auto; padding: 12px 16px 14px; }
  .page h2 { font-size: clamp(20px, 5.4vw, 26px); line-height: 1.05; }
  .page .when { display: block; margin-top: 4px; color: #8a8176; letter-spacing: .12em; text-transform: uppercase; font-size: 10px; }
  .page p { margin: 6px 0 0; color: #5e574e; line-height: 1.35; font-size: 13px; }
  .hint {
    position: fixed; left: 0; right: 0;
    bottom: max(14px, env(safe-area-inset-bottom));
    text-align: center; color: #8a8680;
    letter-spacing: .18em; text-transform: uppercase; font-size: 11px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="book" id="book">
    <div class="shadow"></div>
    <div id="leaves"></div>
  </div>
</div>
<div class="hint" id="hint">Tap to open</div>
<script>
const pages = [
  { cover: true, title: "The house", sub: "Asha · Rohan" },
  { title: "The morning of", sub: "12 January", img: "photos/wedding.jpg", note: "Before anyone arrived. The flowers were already falling." },
  { title: "Her hands", sub: "12 January", img: "photos/hands.jpg", note: "The henna was still dark. She kept them in her lap." },
  { title: "The whole lane", sub: "3 July", img: "photos/rain.jpg", note: "He held the umbrella. She held his arm." },
  { title: "Two glasses", sub: "9 September", img: "photos/dinner.jpg", note: "The city stayed outside. They did not." },
  { title: "The window", sub: "22 August", img: "photos/train.jpg", note: "A small vase, and the rain running the glass." },
  { title: "The first evening", sub: "18 March", img: "photos/door.jpg", note: "The suitcase stayed by the door." },
  { cover: true, title: "Kept", sub: "A book for two" }
];
const book = document.getElementById("book");
const leaves = document.getElementById("leaves");
const hint = document.getElementById("hint");
let index = 0;
let busy = false;
function fit() {
  const vv = window.visualViewport;
  const vw = vv ? vv.width : window.innerWidth;
  const vh = vv ? vv.height : window.innerHeight;
  const bottom = 52;
  const side = 28;
  const maxH = Math.max(280, vh - bottom);
  const maxW = Math.max(200, vw - side);
  const height = Math.min(maxH, maxW * 1.46);
  const width = height / 1.46;
  book.style.width = width + "px";
  book.style.height = height + "px";
}
function sheet(p) {
  if (p.cover) return `<div class="face cover"><div><p>${p.sub}</p><div class="rule"></div><h1>${p.title}</h1></div></div>`;
  return `<div class="face page"><div class="plate"><img src="${p.img}" alt="${p.title}"></div><div class="caption"><h2>${p.title}</h2><span class="when">${p.sub}</span><p>${p.note}</p></div></div>`;
}
function draw() {
  leaves.innerHTML = pages.map((p, i) => `
    <div class="leaf" data-i="${i}" style="z-index:${i < index ? i : pages.length - i};transform:rotateY(${i < index ? -180 : 0}deg)">
      ${sheet(p)}
      <div class="face back"></div>
    </div>`).join("");
  hint.textContent = index === 0 ? "Tap to open" : index >= pages.length - 1 ? "Tap to close" : "Tap to turn";
}
function setLeaf(i, angle, duration) {
  const el = leaves.querySelector(`[data-i="${i}"]`);
  if (!el) return;
  el.style.transitionDuration = duration + "s";
  el.style.transform = `rotateY(${angle}deg)`;
  el.style.zIndex = angle < 0 ? i : pages.length - i;
}
book.addEventListener("click", async () => {
  if (busy) return;
  busy = true;
  book.classList.add("turning");
  if (index === 0) {
    book.classList.add("open");
    book.classList.remove("closing");
    setLeaf(0, -180, 0.7);
    index = 1;
  } else if (index < pages.length - 1) {
    setLeaf(index, -180, 0.7);
    index += 1;
  } else {
    book.classList.add("closing");
    book.classList.remove("open");
    for (let i = pages.length - 2; i >= 0; i--) {
      setLeaf(i, 0, 0.5);
      await new Promise(r => setTimeout(r, 80));
    }
    index = 0;
    await new Promise(r => setTimeout(r, 800));
  }
  hint.textContent = index === 0 ? "Tap to open" : index >= pages.length - 1 ? "Tap to close" : "Tap to turn";
  setTimeout(() => { book.classList.remove("turning"); busy = false; }, 720);
});
fit();
draw();
window.addEventListener("resize", fit);
if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
</script>
</body>
</html>
